org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+ParallelRefProcEnabled
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.builtInKotlin=false
android.newDsl=false
org.gradle.parallel=true
# 构建缓存落在 ~/.gradle/caches/build-cache-1，正好被 CI 的 gradle 缓存目录覆盖，
# 所以多 ABI / 多次构建之间能复用 task 输出。
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false
# 没有 daemon 时 file-system watching 建不起来，只会让每次调用多几行告警；
# CI 每个 job 只跑一次 Gradle，watch 也没有第二次构建可以受益。
org.gradle.vfs.watch=false
android.enableJetifier=false
kotlin.incremental=true
